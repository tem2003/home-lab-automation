---
- name: Check if node already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Resolve join command from control plane
  ansible.builtin.set_fact:
    resolved_join_command: "{{ hostvars[control_plane_host].kubeadm_join_command | default('') }}"
  when: not kubelet_conf.stat.exists

- name: Fail if join command missing
  ansible.builtin.fail:
    msg: "No kubeadm join command found on {{ control_plane_host }}. Run control-plane play first."
  when:
    - not kubelet_conf.stat.exists
    - resolved_join_command | length == 0

- name: Join Kubernetes cluster
  ansible.builtin.command: "{{ resolved_join_command }}"
  when: not kubelet_conf.stat.exists
  register: kubeadm_join
  changed_when: kubeadm_join.rc == 0
