---
- name: Check if cluster already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf

- name: Ensure local kubeconfig directory on controller
  ansible.builtin.file:
    path: "{{ kubeconfig_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false

- name: Create kubeadm config
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /tmp/kubeadm-config.yaml
    mode: "0644"
  when: not kubeadm_admin_conf.stat.exists

- name: Pull kubeadm control-plane images
  ansible.builtin.command: kubeadm config images pull --config /tmp/kubeadm-config.yaml
  when: not kubeadm_admin_conf.stat.exists
  register: kubeadm_pull
  changed_when: kubeadm_pull.rc == 0

- name: Initialize kubeadm control plane
  ansible.builtin.command: kubeadm init --config /tmp/kubeadm-config.yaml --upload-certs
  when: not kubeadm_admin_conf.stat.exists
  register: kubeadm_init
  changed_when: kubeadm_init.rc == 0

- name: Create root kubeconfig directory
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Install admin.conf for root
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: "0600"

- name: Create ubuntu kubeconfig directory
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"

- name: Install admin.conf for ubuntu
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Fetch admin.conf to controller artifacts
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeconfig_local_path }}"
    flat: true

- name: Generate join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: kubeadm_join_cmd
  changed_when: false

- name: Store join command as host fact
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ kubeadm_join_cmd.stdout }}"

- name: Publish join command to workers via hostvars
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ kubeadm_join_cmd.stdout }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups[cluster_group + '_workers'] | default([]) }}"
