---
# Runs against the first master of each cluster; uses local kubeconfigs + tools on the controller.
# Install pinned istioctl/kubectl under $HOME/.local/bin (Linux FS, no sudo).

# artifacts/* live on /mnt/d (DrvFs) — omit mode= (chmod EPERM under WSL).
- name: Ensure local artifact directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ artifacts_dir }}"
    - "{{ certs_dir }}"
    - "{{ kubeconfig_dir }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Ensure controller bin directory on Linux filesystem
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true

- name: Check controller kubectl
  ansible.builtin.command: "{{ kubectl_bin }} version --client=true"
  register: kubectl_check
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Install kubectl on controller when missing
  when: kubectl_check.rc != 0
  block:
    - name: Resolve kubectl patch version for channel v{{ k8s_version }}
      ansible.builtin.uri:
        url: "https://dl.k8s.io/release/stable-{{ k8s_version }}.txt"
        return_content: true
      register: kubectl_stable
      delegate_to: localhost
      become: false
      run_once: true

    - name: Download kubectl {{ kubectl_stable.content | trim }}
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_stable.content | trim }}/bin/linux/amd64/kubectl"
        dest: "{{ kubectl_bin }}"
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

- name: Check pinned istioctl binary
  ansible.builtin.command: "{{ istioctl_bin }} version --remote=false"
  register: istioctl_check
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Install pinned istioctl when missing or wrong version
  when: >
    istioctl_check.rc != 0 or
    (istio_version not in (istioctl_check.stdout | default('')))
  block:
    - name: Fetch Istio release tarball
      ansible.builtin.get_url:
        url: "https://github.com/istio/istio/releases/download/{{ istio_version }}/istio-{{ istio_version }}-linux-amd64.tar.gz"
        dest: "/tmp/istio-{{ istio_version }}-linux-amd64.tar.gz"
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Extract istioctl
      ansible.builtin.unarchive:
        src: "/tmp/istio-{{ istio_version }}-linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true
      delegate_to: localhost
      become: false
      run_once: true

    - name: Install istioctl to {{ istioctl_bin }}
      ansible.builtin.shell: |
        set -euo pipefail
        cp -f "/tmp/istio-{{ istio_version }}/bin/istioctl" "{{ istioctl_bin }}"
        chmod 755 "{{ istioctl_bin }}"
      args:
        executable: /bin/bash
      delegate_to: localhost
      become: false
      run_once: true

- name: Generate shared root and intermediate CAs
  ansible.builtin.script:
    cmd: "generate-certs.sh '{{ certs_dir }}' cluster1 cluster2"
  delegate_to: localhost
  become: false
  run_once: true

- name: Install Istio on this cluster
  ansible.builtin.include_tasks: install_cluster.yml
