---
# Enable endpoint discovery between cluster1 and cluster2 (multi-primary).
- name: Create remote secret for cluster1 in cluster2
  ansible.builtin.shell: |
    set -euo pipefail
    "{{ istioctl_bin }}" create-remote-secret \
      --name=cluster1 \
      --kubeconfig "{{ kubeconfig_dir }}/{{ lab_env }}-cluster1.conf" \
      | "{{ kubectl_bin }}" apply --kubeconfig "{{ kubeconfig_dir }}/{{ lab_env }}-cluster2.conf" -f -
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true

- name: Create remote secret for cluster2 in cluster1
  ansible.builtin.shell: |
    set -euo pipefail
    "{{ istioctl_bin }}" create-remote-secret \
      --name=cluster2 \
      --kubeconfig "{{ kubeconfig_dir }}/{{ lab_env }}-cluster2.conf" \
      | "{{ kubectl_bin }}" apply --kubeconfig "{{ kubeconfig_dir }}/{{ lab_env }}-cluster1.conf" -f -
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true
